# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python Cron application

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest
  
    steps:
    - uses: actions/checkout@v2
    - name: Set up Python 3.9
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'
    - name: Cache pip
      uses: actions/cache@v2
      with:
        # This path is specific to Ubuntu
        path: ~/.cache/pip
        # Look to see if there is a cache hit for the corresponding requirements file
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          ${{ runner.os }}-
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Setup .env
      run: |
        echo "# This is .env file for PlexTraktSync
        PLEX_BASEURL=${{ secrets.PLEX_BASEURL }}
        PLEX_FALLBACKURL=${{ secrets.PLEX_FALLBACKURL }}
        PLEX_TOKEN=${{ secrets.PLEX_TOKEN }}
        PLEX_USERNAME=${{ secrets.PLEX_USERNAME }}
        TRAKT_USERNAME=${{ secrets.TRAKT_USERNAME }}" > .env

    - name: Setup .env
      run: |
        echo '{
                "CLIENT_ID": "6004e0c4d4c818de153f9a38982b89f3085a9236723415a4a2b8bf29032ef5c8",
                "CLIENT_SECRET": "fed222bf5cc8a9279066b55341534936be82fa4e40b0bf6959bbd2ad5c2f0805",
                "OAUTH_TOKEN": "383ad22aab02ce24d0210668b6127649983574f9c8e4bce251464e56a4e21614",
                "OAUTH_REFRESH": "7c355c5de8ffc96cefa9fe22a797a6f4bd0a19854428412bc3da132d6b0fe41f",
                "OAUTH_EXPIRES_AT": 1634675383
              }' > .pytrakt.json

    - name: Run Sync
      run: |
        ./plex_trakt_sync.sh
