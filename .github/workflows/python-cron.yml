# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python Cron application

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest
  
    steps:
    - uses: actions/checkout@v2
    - name: Set up Python 3.9
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'
    - name: Cache pip
      uses: actions/cache@v2
      with:
        # This path is specific to Ubuntu
        path: ~/.cache/pip
        # Look to see if there is a cache hit for the corresponding requirements file
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          ${{ runner.os }}-
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Setup settings from github secrets
      run: |
        echo "# This is .env file for PlexTraktSync
        PLEX_BASEURL=${{ secrets.PLEX_BASEURL }}
        PLEX_FALLBACKURL=${{ secrets.PLEX_FALLBACKURL }}
        PLEX_TOKEN=${{ secrets.PLEX_TOKEN }}
        PLEX_USERNAME=${{ secrets.PLEX_USERNAME }}
        TRAKT_USERNAME=${{ secrets.TRAKT_USERNAME }}" > .env

    - name: Run Sync
      run: |
        cat .env